[project]
name = "llm-as-story-teller-with-function-calling"
version = "0.1.0"
description = "Проект-игра на основе LLM как драйвер мира и истории"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel",
    "transformers==5.20.2",
    "torch==2.14.0",
    "peft==0.21.2",
    "accelerate",
    "vllm==0.33.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["ruff", "pytest", "mypy", "pre-commit"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
